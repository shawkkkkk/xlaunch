name: Production Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        env:
          URL: ${{ secrets.XLAUNCH_PROD_URL }}
        run: |
          test -n "$URL"
          curl --fail-with-body --retry 2 --max-time 30 "$URL/api/health"

      - name: Readiness
        env:
          URL: ${{ secrets.XLAUNCH_PROD_URL }}
        run: |
          body=$(curl --fail-with-body --retry 2 --max-time 30 "$URL/api/readiness")
          echo "$body"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (!body.publicLaunchReady) {
              console.error("Core public launch readiness is false.");
              process.exit(1);
            }
          ' "$body"

      - name: Public routes
        env:
          URL: ${{ secrets.XLAUNCH_PROD_URL }}
        run: |
          for path in / /explore /profile /terms /privacy /risk; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL$path")
            test "$code" -ge 200 -a "$code" -lt 400 || {
              echo "$path returned $code"
              exit 1
            }
          done
